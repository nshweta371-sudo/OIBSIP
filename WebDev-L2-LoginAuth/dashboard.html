<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard | SecureAuth</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="dashboard">

        <nav class="navbar">

            <div class="brand">
                🔐 SecureAuth
            </div>

            <button
                id="logoutBtn"
                class="logout-btn"
            >
                Logout
            </button>

        </nav>


        <main class="dashboard-content">

            <div class="welcome-card">

                <div class="dashboard-icon">
                    👋
                </div>

                <h1>
                    Welcome to your Dashboard
                </h1>

                <p>
                    You have successfully logged in.
                </p>

                <div class="user-info">

                    <p>
                        <strong>Username:</strong>
                        <span id="dashboardUsername"></span>
                    </p>

                    <p>
                        <strong>Email:</strong>
                        <span id="dashboardEmail"></span>
                    </p>

                </div>

            </div>

        </main>

    </div>


    <script src="script.js"></script>

</body>

</html>
