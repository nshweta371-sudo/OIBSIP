<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | SecureAuth</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">
                📝
            </div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Register to get started
            </p>


            <form id="registerForm">

                <!-- USERNAME -->

                <div class="form-group">

                    <label for="registerUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="registerUsername"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Minimum 8 characters and 1 number"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <p id="registerError" class="error-message"></p>

                <p id="registerSuccess" class="success-message"></p>


                <button
                    type="submit"
                    class="primary-btn"
                >
                    Register
                </button>

            </form>


            <p class="switch-page">

                Already have an account?

                <a href="index.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
